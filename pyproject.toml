[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gedi-aoi-qaqc"
version = "0.1.0"
description = "Resumable GEDI V3 acquisition and source-linked QA/QC for polygon AOIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "h5py>=3.10,<4", "shapely>=2.1,<3", "pyogrio>=0.9,<1", "pyproj>=3.6,<4", "pyarrow>=15,<27", "duckdb>=1.1,<3"]
[project.scripts]
gedi-aoi = "gedi_aoi.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gedi_aoi = ["*.json"]
